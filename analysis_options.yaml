# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-ide) and can also be produced on the
# command line by running `flutter analyze`.

# Base set for Flutter apps.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # Project rules on top of `flutter_lints`.
  #
  # The baseline is "zero analyzer output", not "zero errors": `flutter analyze`
  # exits non-zero only on errors, so warnings and infos accumulate silently.
  # Every rule below was enabled only after the codebase passed it — keep it
  # that way (a new violation is a build failure, not a review comment).
  rules:
    # Use the dedicated widget instead of a bare `Container` (see the
    # flutter-best-practices rule set): `Container` has no const constructor,
    # `SizedBox`/`ColoredBox` express intent.
    - sized_box_for_whitespace
    - use_colored_box
    # Local style: const where possible, final for never-reassigned locals.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    # `late` is for "initialised later by someone else"; a field with an
    # initializer at its declaration does not need it.
    - unnecessary_late
    # `part of` must quote the library name.
    - use_string_in_part_of_directives

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
