name: myhanout
description: "Offline-first inventory & checkout for small shops, on any Android phone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  mobile_scanner: ^7.4.2
  share_plus: ^10.1.4
  file_picker: ^10.0.3
  http: ^1.6.0
  easy_localization: ^3.0.7
  shared_preferences: ^2.5.4
  sqflite_common_ffi: ^2.3.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  image: ^4.12.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  crypto: ^3.0.7
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/catalog_seed.db
    - assets/signers.json
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800

flutterGradlePlugin:
  flutter_plugin_android_lifecycle: ^2.0.39
